[tool.poetry]
name = "crypto-intel-engine"
version = "0.1.0"
description = "Dual-Engine Crypto Intelligence: Spot Cycle Valuation, Real-time Futures Risk & Multi-Agent Socratic Auditing Platform"
authors = ["CryptoIntel Architecture Team <lead@cryptointel.io>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
websockets = "^12.0"
httpx = "^0.27.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
polars = "^0.20.0"
scipy = "^1.13.0"
langchain = "^0.2.0"
langgraph = "^0.0.60"
langchain-google-genai = "^1.0.0"
langchain-community = "^0.2.0"
langfuse = "^2.30.0"
redis = "^5.0.0"
streamlit = "^1.35.0"
plotly = "^5.22.0"
python-telegram-bot = "^21.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
deepeval = "^0.21.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
black = "^24.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
