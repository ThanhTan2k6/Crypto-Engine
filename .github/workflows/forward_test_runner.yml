name: 24/7 Automated Forward-Test Runner

on:
  schedule:
    # Runs every 30 minutes 24/7/365 without requiring any local computer on
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  run-bot-tick:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic numpy pytest

      - name: Execute Multi-Symbol Forward Test Tick
        run: |
          python -m src.execution.runner --symbols BTCUSDT,ETHUSDT,SOLUSDT --ticks 3 --interval 10

      - name: Commit & Push Updated Bot State
        run: |
          git config --local user.email "bot-runner@cryptointel.internal"
          git config --local user.name "CryptoIntel 24/7 Runner"
          git add data/paper_trading_state.json || true
          git commit -m "chore(bot): 24/7 forward-test tick state update [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
