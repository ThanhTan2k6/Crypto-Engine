name: CI Quality Gate & Type Safety Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint with Ruff
        run: poetry run ruff check src/ tests/

      - name: Type Check with MyPy (Strict)
        run: poetry run mypy --strict src/

      - name: Check for Prohibited LLM Imports in Deterministic Quant Layer
        run: |
          python -c "
          import os, sys
          engine_dir = 'src/engine'
          banned = ['langchain', 'langgraph', 'google.genai', 'openai', 'instructor']
          failed = False
          if os.path.exists(engine_dir):
              for root, _, files in os.walk(engine_dir):
                  for file in files:
                      if file.endswith('.py'):
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8') as f:
                              content = f.read()
                              for b in banned:
                                  if b in content:
                                      print(f'CRITICAL ERROR: Banned import {b} found in {path}')
                                      failed = True
          if failed:
              sys.exit(1)
          print('PASSED: Deterministic Quant Engine is 100% free of LLM dependencies.')
          "

      - name: Run Unit Tests
        run: poetry run pytest tests/ -v
